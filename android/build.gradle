plugins {
    id "com.android.application" version "8.3.2" apply false
    // org.jetbrains.kotlin.android is intentionally omitted here.
    // Flutter's includeBuild (settings.gradle) already puts it on the
    // classpath via flutter_tools/gradle — declaring it again with an
    // explicit version causes: "plugin already on the classpath".
    id "com.google.gms.google-services" version "4.4.4" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
