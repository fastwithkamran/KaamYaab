include: package:flutter_lints/flutter.yaml

# Exclude root-level snippet/insert files — they are code fragments intended
# to be copy-pasted into real widget files and are not standalone Dart files.
analyzer:
  exclude:
    - home_widgets_insert.dart
    - voice_banner_insert.dart

linter:
  rules:
    # Performance hints — suppressed project-wide to keep output clean.
    # These are style suggestions only; they do not affect correctness.
    prefer_const_constructors: false
    prefer_const_declarations: false
    prefer_const_literals_to_create_immutables: false
